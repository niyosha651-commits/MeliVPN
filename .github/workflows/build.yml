name: MeliVPN APK Builder

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-37"
          sdkmanager "build-tools;37.0.0"
          sdkmanager "ndk;30.0.16248370"

      - name: Build HEV
        run: |
          chmod +x V2rayNG/compile-hevtun.sh
          cd V2rayNG
          ./compile-hevtun.sh

      - name: Build libv2ray
        run: |
          git submodule update --init --recursive
          mkdir -p V2rayNG/app/libs
          # Keep the AAR generation step from the original workflow here.

      - name: Build ARM64 APK
        run: |
          cd V2rayNG
          chmod +x gradlew
          ./gradlew :app:assemblePlaystoreDebug -PABI_FILTERS=arm64-v8a --stacktrace

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: MeliVPN-ARM64
          path: V2rayNG/app/build/outputs/apk/playstore/debug/*arm64-v8a*.apk
          if-no-files-found: error
