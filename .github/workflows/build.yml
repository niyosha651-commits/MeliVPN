name: MeliVPN Alpha Builder

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: MeliVPN Alpha 0.1.1 ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --channel=0 \
            --install "ndk;30.0.16248370"

          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV

          sed -i '10i\
              ndkVersion = "30.0.16248370"' \
              V2rayNG/app/build.gradle.kts

      - name: Restore HEV Cache
        id: hev-cache
        uses: actions/cache/restore@v6
        with:
          path: libs
          key: hev-${{ runner.os }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build HEV
        if: steps.hev-cache.outputs.cache-hit != 'true'
        run: |
          bash compile-hevtun.sh

      - name: Save HEV Cache
        if: steps.hev-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: libs
          key: hev-${{ runner.os }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Copy HEV Libraries
        run: |
          cp -r libs V2rayNG/app/

      - name: Get Xray Version
        run: |
          cd AndroidLibXrayLite

          CURRENT_TAG=$(git describe --tags --abbrev=0)

          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/

      - name: Setup Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Build MeliVPN Alpha
        run: |
          cd V2rayNG

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          chmod 755 gradlew

          ./gradlew :app:assemblePlaystoreDebug \
            -PABI_FILTERS=arm64-v8a \
            --stacktrace

      - name: Upload MeliVPN Alpha APK
        uses: actions/upload-artifact@v7
        with:
          name: MeliVPN-Alpha-0.1.1-ARM64
          path: V2rayNG/app/build/outputs/apk/playstore/debug/*arm64-v8a*.apk
          if-no-files-found: error
