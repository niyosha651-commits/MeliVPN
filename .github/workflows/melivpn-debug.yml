name: MeliVPN APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MeliVPN
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Components
        run: |
          sdkmanager "platforms;android-37"
          sdkmanager "build-tools;37.0.0"
          sdkmanager "platform-tools"
          sdkmanager "ndk;30.0.16248370"

      - name: Prepare Project
        run: |
          sed -i 's/compileSdk = 36/compileSdk = 37/' V2rayNG/app/build.gradle.kts

      - name: Build APK
        run: |
          cd V2rayNG
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assemblePlaystoreDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeliVPN-APK
          path: V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
          if-no-files-found: error
